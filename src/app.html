<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>GithubArchive+</title>
		<meta
			name="description"
			content="Repository intelligence and website discovery — archive, explore, and curate."
		/>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('gha-theme') || 'dark';
					var dark = mode === 'dark' || (mode !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
